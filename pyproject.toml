[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "oslo-energy"
version = "0.1.0"
description = "Power and electricity data pipeline for Norway"
requires-python = ">=3.10"
dependencies = [
    "httpx",
    "psycopg[binary]"
]

[tool.setuptools.packages.find]
where = ["src"]
